    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .body-letter {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5eedf;
        }

        .letter {
            position: relative;
            z-index: 1;
        }

        .envelope-interaction {
            position: relative;
            top: 50px;
            cursor: pointer;
            animation: up 3s linear infinite;
        }

        @keyframes up {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }


        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #346353;
        }

        .envelope:before {
            background-color: #346353;
            content: "";
            position: absolute;
            width: 212px;
            height: 212px;
            transform: rotate(45deg);
            top: -105px;
            left: 44px;
            border-radius: 30px 0 0 0;
        }

        .card {
            position: absolute;
            background-color: #fff5dd;
            width: 270px;
            height: 170px;
            top: 5px;
            left: 15px;
            box-shadow: -5px -5px 100px rgba(0, 0, 0, 0.4);
        }

        .card:before {
            content: "";
            position: absolute;
            border: 3px solid #294f42;
            border-style: dotted;
            width: 240px;
            heighT: 140px;
            left: 12px;
            top: 12px;
        }

        .text {
            position: absolute;
            font-family: Arial, sans-serif;
            font-size: 26px;
            text-align: center;
            line-height: 1.2;
            top: 30px;
            inset-inline: 12px;
            color: #294f42;
        }

        .card-date {
            display: block;
            margin-top: 6px;
            color: #795721;
            font: 700 14px Georgia, serif;
            letter-spacing: .1em;
        }

        .petals {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .petals span {
            position: absolute;
            top: 25px;
            left: var(--petal-x);
            width: 10px;
            height: 16px;
            border-radius: 85% 10% 85% 20%;
            background: #c18b39;
            animation: petal-rise 2.8s ease-out var(--petal-delay) infinite;
        }

        @keyframes petal-rise {
            from { transform: rotate(25deg) scale(.5); opacity: 0; }
            25% { opacity: .9; }
            to { transform: translate(35px, -140px) rotate(150deg); opacity: 0; }
        }

        .front {
            position: absolute;
            border-right: 180px solid #437563;
            border-top: 95px solid transparent;
            border-bottom: 100px solid transparent;
            left: 120px;
            top: 5px;
            width: 0;
            height: 0;
            z-index: 10;
        }

        .front:before {
            position: absolute;
            content: "";
            border-left: 300px solid #548472;
            border-top: 195px solid transparent;
            left: -120px;
            top: -95px;
            width: 0;
            height: 0;
        }

        .shadow {
            position: absolute;
            width: 330px;
            height: 25px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            top: 265px;
            left: -15px;
            animation: scale 3s linear infinite;
            z-index: -1;
        }

        @keyframes scale {

            0%,
            100% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0.85);
            }
        }

        .hover-animation {
            animation: hover 1.75s ease-in-out infinite;
        }

        #castle {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100svh;

            background-color: white;
            border-radius: 100%;

            opacity: 0;
        }

        @keyframes hover {
            0% {
                margin-top: 60px;
            }

            50% {
                margin-top: 50px;
            }

            100% {
                margin-top: 60px;
            }
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 25px 0 #e8b2ca;
            }

            50% {
                box-shadow: 0 0 45px 0 #e8b2ca;
            }

            100% {
                box-shadow: 0 0 25px 0 #e8b2ca;
            }
        }

        @keyframes fall {
            5% {
                top: 209px;
                left: 105px;
                transform: rotate(55deg) scale(0.9, 0.95) skew(-18deg);
                opacity: 0.9;
            }

            30% {
                left: 90px;
            }

            55% {
                left: 130px;
            }

            60%,
            100% {
                top: 380px;
                transform: rotate(30deg) scale(0.9, 0.95) skew(-32deg);

            }

        @keyframes floatAnimate {
            0% {
                background-size: 105% 120%;
                background-position: 0 0;
                opacity: 0.7;
            }

                background-size: 100% 100%;
                background-position: 0 0;
                opacity: 0.5;
            }

            100% {
                background-size: 105% 120%;
                background-position: 0 0;
                opacity: 0.7;
            }
        }

    <style>
        /* Reveal the complete layout at once so the sheet stays still as words appear. */
        .wrapperLetterForm {
            position: fixed;
            height: 100dvh;
            background: rgba(20, 37, 30, .68);
        }

        .wrapperLetterForm.is-open {
            animation: letter-backdrop-in 200ms ease-out both;
        }

        .is-open .formLetter {
            animation: letter-unfold 480ms cubic-bezier(.16, 1, .3, 1) both;
            transform-origin: center bottom;
        }

        .is-open .before {
            animation: letter-backing-in 560ms cubic-bezier(.16, 1, .3, 1) both;
        }

        .is-open .textLetter h2 {
            animation: letter-heading-in 360ms 80ms ease-out both;
        }

        .letter-word {
            display: inline-block;
            white-space: nowrap;
        }

        .letter-character {
            position: relative;
            display: inline-block;
            animation: letter-character-in 240ms var(--character-delay) ease-out both;
        }

        .letter-character::after {
            content: "";
            position: absolute;
            right: -2px;
            top: .12em;
            height: 1em;
            width: 1px;
            background: #95713b;
            opacity: 0;
            animation: letter-caret var(--character-step) var(--character-delay) step-end;
            pointer-events: none;
        }

        @keyframes letter-character-in {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes letter-caret {
            0%, 99% { opacity: 1; }
            100% { opacity: 0; }
        }

        .textLetter .contentLetter {
            line-height: 1.65;
        }

        @keyframes letter-backdrop-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes letter-unfold {
            from { opacity: 0; transform: translateY(26px) scale(.94) rotate(-2deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }

        @keyframes letter-backing-in {
            from { opacity: 0; transform: translateY(18px) rotate(-5deg) scale(.94); }
            to { opacity: 1; transform: translateY(0) rotate(-15deg) scale(1); }
        }

        @keyframes letter-heading-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes letter-word-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .wrapperLetterForm.is-open,
            .is-open .formLetter,
            .is-open .before,
            .is-open .textLetter h2,
            .letter-character, .letter-character::after {
                animation: none;
            }
        }
    </style>
    <style>
        .letter-effects {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .letter-petal {
            position: absolute;
            top: -24px;
            left: var(--petal-left);
            width: var(--petal-size);
            height: calc(var(--petal-size) * 1.5);
            border-radius: 80% 12% 80% 20%;
            background: var(--petal-color);
            opacity: 0;
            animation: letter-petal-fall var(--petal-duration) var(--petal-delay) ease-in-out both;
        }

        .is-open .formLetter::before,
        .is-open .formLetter::after {
            content: "";
            position: absolute;
            width: 13px;
            height: 13px;
            background: #c79b51;
            clip-path: polygon(50% 0, 60% 38%, 100% 50%, 60% 62%, 50% 100%, 40% 62%, 0 50%, 40% 38%);
            pointer-events: none;
            animation: letter-sparkle 1.8s 450ms ease-in-out 3 both;
        }

        .is-open .formLetter::before { top: 13px; left: 13px; }
        .is-open .formLetter::after {
            right: 13px;
            bottom: 13px;
            animation-delay: 1s;
        }

        .wrapperLetterForm .fa-xmark { z-index: 200; }

        @keyframes letter-petal-fall {
            0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0); }
            12% { opacity: .8; }
            75% { opacity: .65; }
            100% { opacity: 0; transform: translate3d(var(--petal-drift), 100dvh, 0) rotate(300deg); }
        }

        @keyframes letter-sparkle {
            0%, 100% { opacity: .25; transform: scale(.6) rotate(0); }
            50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .letter-effects { display: none; }
            .is-open .formLetter::before,
            .is-open .formLetter::after { animation: none; }
        }
    </style>
    <style>
        .gift-overlay {
            height: 100dvh;
            overflow: auto;
        }

        .gift-container {
            padding-block: 28px;
        }

        .gift-title {
            animation: cover-text-in 650ms cubic-bezier(.16, 1, .3, 1) both;
        }

        .gift-card {
            animation: cover-image-in 800ms 120ms cubic-bezier(.16, 1, .3, 1) backwards;
            transition: transform 300ms ease, box-shadow 300ms ease;
        }

        .gift-card img {
            transition: transform 550ms cubic-bezier(.16, 1, .3, 1);
        }

        .gift-subtitle {
            animation: cover-text-in 650ms 320ms cubic-bezier(.16, 1, .3, 1) backwards;
        }

        @media (hover: hover) and (pointer: fine) {
            .gift-card:hover {
                transform: translateY(-5px) rotate(-1deg);
                box-shadow: 0 12px 28px rgba(41, 79, 66, .12);
            }

            .gift-card:hover img {
                transform: scale(1.035);
            }
        }

        .gift-card:active {
            transform: scale(.975);
        }

        @keyframes cover-text-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cover-image-in {
            from { opacity: 0; transform: translateY(28px) scale(.94) rotate(2deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .gift-title, .gift-card, .gift-subtitle {
                animation: none;
            }

            .gift-card, .gift-card img {
                transition: none;
            }

            .gift-card:hover, .gift-card:active, .gift-card:hover img {
                transform: none;
            }
        }
    </style>
    <style>
        .gift-card {
            position: relative;
            animation:
                cover-image-in 800ms 120ms cubic-bezier(.16, 1, .3, 1) backwards,
                cover-float 4.2s 920ms ease-in-out infinite;
        }

        .chalk-dust {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
        }

        .chalk-dust span {
            position: absolute;
            left: var(--dust-x);
            top: var(--dust-y);
            width: var(--dust-size);
            height: var(--dust-size);
            border-radius: 50%;
            background: #fff9dc;
            opacity: 0;
            animation: chalk-drift 4s var(--dust-delay) ease-in-out infinite;
        }

        .gift-subtitle {
            animation:
                cover-text-in 650ms 320ms cubic-bezier(.16, 1, .3, 1) backwards,
                cover-hint 2.6s 1s ease-in-out infinite;
        }

        @keyframes cover-float {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -8px; }
        }

        @keyframes chalk-drift {
            0%, 100% { opacity: 0; transform: translateY(5px) scale(.5); }
            30% { opacity: .8; }
            65% { opacity: .45; transform: translateY(-14px) scale(1); }
            90% { opacity: 0; transform: translateY(-25px) scale(.5); }
        }

        @keyframes cover-hint {
            0%, 100% { opacity: 1; }
            50% { opacity: .55; }
        }

        @media (prefers-reduced-motion: reduce) {
            .gift-card, .gift-subtitle { animation: none; }
            .chalk-dust { display: none; }
        }
    </style>
</head>

    <script>
        let rid = null; // request animation id
        const SVG_NS = "http://www.w3.org/2000/svg";
        const pathlength = shape.getTotalLength();

        let t = 0; // at the begining of the path
        let lengthAtT = pathlength * t;

        let d = shape.getAttribute("d");

        // 1. build the d array
        let n = d.match(/C/gi).length; // how many times

        let pos = 0; // the position, used to find the indexOf the nth C

        class subPath {
            constructor(d) {
                this.d = d;
                this.get_PointsRy();
                this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
                this.measurePath();
                this.get_M_Point(); //lastPoint
                this.lastCubicBezier;
                this.get_lastCubicBezier();
            }

            get_PointsRy() {
                this.pointsRy = [];
                let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v); // remove empty elements
                temp.map(item => {
                    this.pointsRy.push(parseFloat(item));
                }); //this.pointsRy numbers not strings
            }

            measurePath() {
                let path = document.createElementNS(SVG_NS, "path");
                path.setAttributeNS(null, "d", this.d);
                // no need to append it to the SVG
                // the lengths of every path in dry
                this.pathLength = path.getTotalLength();
            }

            get_M_Point() {
                if (this.previous) {
                    let p = this.previous.pointsRy;
                    let l = p.length;
                    this.M_point = [p[l - 2], p[l - 1]];
                } else {
                    let p = this.pointsRy;
                    this.M_point = [p[0], p[1]];
                }
            }

            get_lastCubicBezier() {
                let lastIndexOfC = this.d.lastIndexOf("C");
                let temp = this.d
                    .substring(lastIndexOfC + 1)
                    .split(/[\s,]/)
                    .filter(v => v);
                let _temp = [];
                temp.map(item => {
                    _temp.push(parseFloat(item));
                });
                this.lastCubicBezier = [this.M_point];
                for (let i = 0; i < _temp.length; i += 2) {
                    this.lastCubicBezier.push(_temp.slice(i, i + 2));
                }
            }
        }

        let subpaths = [];

        // create new subPaths
        for (let i = 0; i < n; i++) {
            // finds the of nth C in d
            let newpos = d.indexOf("C", pos + 1);
            if (i > 0) {
                // if it's not the first C
                let sPath = new subPath(d.substring(0, newpos));
                subpaths.push(sPath);
            }
            //change the value of the position pos
            pos = newpos;
        }
        // at the end add d to the subpaths array
        subpaths.push(new subPath(d));

        // 2. get the index of the bezierLengths where the point at t is
        let index;
        for (index = 0; index < subpaths.length; index++) {
            if (subpaths[index].pathLength >= lengthAtT) {
                break;
            }
        }

        function get_T(t, index) {
            let T;
            lengthAtT = pathlength * t;
            if (index > 0) {
                T =
                    (lengthAtT - subpaths[index].previous.pathLength) /
                    (subpaths[index].pathLength - subpaths[index].previous.pathLength);
            } else {
                T = lengthAtT / subpaths[index].pathLength;
            }
            //console.log(T)
            return T;
        }

        let T = get_T(t, index);

        let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);

        drawCBezier(newPoints, partialPath, index);

        function getBezierPoints(t, points) {
            let helperPoints = [];

            // helper points 0,1,2
            for (let i = 1; i < 4; i++) {
                //points.length must be 4 !!!
                let p = lerp(points[i - 1], points[i], t);
                helperPoints.push(p);
            }

            // helper points 3,4
            helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
            helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));

            // helper point 5 is where the first Bézier ends and where the second Bézier begins
            helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));

            // points for the dynamic bézier
            let firstBezier = [
                points[0],
                helperPoints[0],
                helperPoints[3],
                helperPoints[5]
            ];
            //console.log(firstBezier)
            return firstBezier;
        }

        function lerp(A, B, t) {
            let ry = [
                (B[0] - A[0]) * t + A[0], //x
                (B[1] - A[1]) * t + A[1] //y
            ];
            return ry;
        }

        function drawCBezier(points, path, index) {
            let d;

            if (index > 0) {
                d = subpaths[index].previous.d;
            } else {
                d = `M${points[0][0]},${points[0][1]} C`;
            }

            // points.length == 4
            for (let i = 1; i < 4; i++) {
                d += ` ${points[i][0]},${points[i][1]} `;
            }
            //console.log(d)
            partialPath.setAttributeNS(null, "d", d);
        }
    </script>

        const textLetter = document.querySelector('.textLetter h2');

        const textLetterP = "Nhân ngày Nhà giáo Việt Nam 20/11, em kính chúc thầy cô luôn mạnh khỏe, hạnh phúc và có thật nhiều niềm vui trong công việc. Em cảm ơn thầy cô đã tận tâm dạy dỗ và luôn động viên em trong suốt những năm tháng học trò.";

        function addLetterEffects(overlay) {
            overlay.querySelector('.letter-effects')?.remove();
            const effects = document.createElement('div');
            effects.className = 'letter-effects';
            effects.setAttribute('aria-hidden', 'true');

            for (let index = 0; index < 18; index++) {
                const petal = document.createElement('span');
                petal.className = 'letter-petal';
                petal.style.setProperty('--petal-left', ((index * 37) % 100) + '%');
                petal.style.setProperty('--petal-size', (7 + index % 5) + 'px');
                petal.style.setProperty('--petal-color', ['#dfbd78', '#f3dfac', '#9aaf87'][index % 3]);
                petal.style.setProperty('--petal-duration', (3.4 + (index % 4) * .3) + 's');
                petal.style.setProperty('--petal-delay', (index * .075) + 's');
                petal.style.setProperty('--petal-drift', (index % 2 ? 65 : -65) + 'px');
                effects.appendChild(petal);
            }

            overlay.prepend(effects);
        }

        function animateLetterText(element, text, startDelay, characterDelay) {
            const fragment = document.createDocumentFragment();
            const segmenter = typeof Intl.Segmenter === 'function'
                ? new Intl.Segmenter('vi', { granularity: 'grapheme' })
                : null;
            let characterIndex = 0;

            text.split(' ').forEach((word, wordIndex) => {
                if (wordIndex > 0) fragment.appendChild(document.createTextNode(' '));
                const wordSpan = document.createElement('span');
                wordSpan.className = 'letter-word';
                const characters = segmenter
                    ? Array.from(segmenter.segment(word), item => item.segment)
                    : Array.from(word.normalize('NFC'));

                characters.forEach(character => {
                    const span = document.createElement('span');
                    span.className = 'letter-character';
                    span.textContent = character;
                    span.style.setProperty('--character-delay', (startDelay + characterIndex * characterDelay) + 'ms');
                    span.style.setProperty('--character-step', characterDelay + 'ms');
                    wordSpan.appendChild(span);
                    characterIndex++;
                });

                fragment.appendChild(wordSpan);
            });

            element.replaceChildren(fragment);
        }
        function revealLetter() {
            animateLetterText(textLetter, textLetterH2, 140, 24);
            animateLetterText(textLetterContent, textLetterP, 600, 12);
            const overlay = document.querySelector('.wrapperLetterForm');
            overlay.scrollTop = 0;
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                addLetterEffects(overlay);
            }
            $('.wrapperLetterForm').stop(true, true).show().addClass('is-open');
        }

                //Stick
                stickLine.setAttribute("stroke", "black");
                stickLine.setAttribute("fill", "none");
                // Leaf S1
                leafS1.setAttribute("stroke", "black");
                leafS1.setAttribute("fill", "none");
                //Rose One
                rose1.setAttribute("stroke", "black");
                rose1.setAttribute("fill", "none");
                //Rose Two
                rose2.setAttribute("stroke", "black");
                rose2.setAttribute("fill", "none");
                //Rose Three
                rose3.setAttribute("stroke", "black");
                rose3.setAttribute("fill", "none");
                //Rose Three
                rose4.setAttribute("stroke", "black");
                rose4.setAttribute("fill", "none");
            },
            complete: function (anim) {
                //Leaf One
                leafOne.setAttribute("fill", "#6f8e59");
                leafOne.setAttribute("stroke", "none");
                //Leaf Two 
                leafTwo.setAttribute("fill", "#6f8e59");
                leafTwo.setAttribute("stroke", "none");
                //Stick
                stickLine.setAttribute("fill", "#456b55");
                stickLine.setAttribute("stroke", "none");
                // Leaf S1
                leafS1.setAttribute("fill", "#6f8e59");
                leafS1.setAttribute("stroke", "none");
                // Rose 1
                rose1.setAttribute("fill", "#dfab53");
                rose1.setAttribute("stroke", "none");
                // Rose 2
                rose2.setAttribute("fill", "#b87d34");
                rose2.setAttribute("stroke", "none");
                // Rose 3
                rose3.setAttribute("fill", "#dfab53");
                rose3.setAttribute("stroke", "none");
                // Rose 3
                rose4.setAttribute("fill", "#b87d34");
                rose4.setAttribute("stroke", "none");
            },
            autoplay: false,
        });

        // Function để bắt đầu SVG text animation
        function startAnimation() {
            if (typeof rid !== 'undefined') {
                rid = window.requestAnimationFrame(Typing);
                function Typing() {
                    rid = window.requestAnimationFrame(Typing);
                    if (t >= 1) {
                        window.cancelAnimationFrame(rid);
                        rid = null;
                    } else {
                        t += 0.0025;
                    }

                    lengthAtT = pathlength * t;
                    for (index = 0; index < subpaths.length; index++) {
                        if (subpaths[index].pathLength >= lengthAtT) {
                            break;
                        }
                    }
                    T = get_T(t, index);
                    newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
                    drawCBezier(newPoints, partialPath, index);
                }
            }
        }

        // Function để ẩn giao diện tặng nè và hiện bông hoa
        async function hideGiftOverlay() {
            const overlay = document.getElementById('giftOverlay');
            if (overlay.dataset.opening) return;
            overlay.dataset.opening = 'true';
            overlay.querySelector('.gift-card').disabled = true;
            document.querySelector("#rose-t").style.display = "flex";

            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const transition = overlay.animate(
                    [{ opacity: 1 }, { opacity: 0 }],
                    { duration: 380, easing: 'ease-out', fill: 'forwards' }
                );
                await transition.finished;
            }

            overlay.style.display = 'none';
            lineDrawing.play();

            // Sau 4.5 giây thì chuyển sang giao diện thư và hiện SVG text animation cùng lúc
            setTimeout(() => {
                document.querySelector("#rose-t").style.display = "none";
                document.querySelector("#castle").style.display = "flex";

                // Hiện SVG text animation cùng lúc với bức thư
                document.getElementById('theSvg').style.display = 'block';

                // Kích hoạt SVG animation ngay lập tức
                if (typeof startAnimation === 'function') {
                    startAnimation();
                }
            }, 4500);
        }

    </script>
